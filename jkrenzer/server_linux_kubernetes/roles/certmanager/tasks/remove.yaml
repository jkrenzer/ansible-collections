---
- name: Remove Let's Encrypt ClusterIssuer
  kubernetes.core.k8s:
    state: absent
    kind: ClusterIssuer
    name: letsencrypt-cluster-issuer
- name: Remove cert-manager deployment
  kubernetes.core.helm:
    chart_ref: "{{ certmanager_config.helm.chart_ref }}"
    create_namespace: true
    release_name: "{{ certmanager_config.helm.release_name }}"
    release_namespace: "{{ certmanager_config.helm.release_namespace }}"
    release_state: absent
    set_values: "{{ certmanager_config.helm.set_values | default(omit) }}"
- name: Remove jetstack helm repo for cert-manager
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "{{ certmanager_config.helm.repo_url }}"
    repo_state: absent
