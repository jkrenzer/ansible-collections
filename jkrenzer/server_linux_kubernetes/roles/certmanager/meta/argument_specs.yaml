---
argument_specs:
  main:
    short_description: Argument spec for certmanager role
    options:
      certmanager_config:
        description: Configuration for certmanager Helm chart
        type: dict
        options:
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description: Desired state of the role
          version:
            type: str
            default: v1.5.3
            description: Version of the app to install
          acme:
            type: dict
            description: ACME configuration for Let's Encrypt
            options:
              email:
                type: str
                description: Email address for ACME registration
                required: true
              server:
                type: str
                default: https://acme-v02.api.letsencrypt.org/directory
                description: ACME server URL
              ingress_class:
                type: str
                description: Ingress class to use for ACME challenges
          helm:
            type: dict
            description: Helm chart configuration
            options:
              chart:
                type: dict
                description: Helm chart details
                options:
                  ref:
                    type: str
                    default: jetstack/cert-manager
                    description: Reference name of the helm chart
                  version:
                    type: str
                    default: v1.5.3
                    description: Version of the helm chart
                  release_name:
                    type: str
                    default: cert-manager
                    description: Name of the helm release
                  release_namespace:
                    type: str
                    default: cert-manager
                    description: Namespace of the helm release
                  create_namespace:
                    type: bool
                    default: true
                    description: Create the namespace if it does not exist
              repos:
                type: list
                description: List of helm repositories
                elements: dict
                default:
                  - name: jetstack
                    url: https://charts.jetstack.io
                options:
                  name:
                    type: str
                    description: Name of the helm repository
                  url:
                    type: str
                    description: URL of the helm repository
              repo_key_dest:
                type: str
                default: /usr/share/keyrings/helm_signing.asc
                description: Destination for the signing keys of helm
              values:
                type: dict
                description: Values to set in the helm chart
                default:
                  crds:
                    enabled: true
